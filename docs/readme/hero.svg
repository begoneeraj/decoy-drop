<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title"><title id="title">Decoy Drop — Every photo tells a location story.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142135"/><stop offset="1" stop-color="#080c15"/></linearGradient></defs><style>@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes orbit{to{transform:rotate(360deg)}}.intro{animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}.orbit{transform-origin:1010px 170px;animation:orbit 24s linear infinite}@media(prefers-reduced-motion:reduce){.intro,.orbit{animation:none}}</style><rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#bg)" stroke="#2b3c53"/><g fill="none" stroke="#7dbbff"><circle cx="1010" cy="170" r="110" opacity=".15"/><circle cx="1010" cy="170" r="76" opacity=".25"/><g class="orbit"><ellipse cx="1010" cy="170" rx="135" ry="48" transform="rotate(-35 1010 170)" opacity=".5"/><circle cx="1120" cy="170" r="7" fill="#7dbbff"/></g><path d="m988 156-16 14 16 14m44-28 16 14-16 14m-15-35-14 42" stroke-width="3" stroke-linecap="round"/></g><g class="intro" font-family="Segoe UI,Arial,sans-serif"><text x="60" y="68" fill="#7dbbff" font-size="14" letter-spacing="3">EXIF + MAPS / LOCAL TOOLS</text><text x="60" y="162" fill="#f1f5fb" font-weight="700" font-size="62">Decoy Drop</text><text x="60" y="220" fill="#b7c6d9" font-size="25">Every photo tells a location story.</text><path d="M60 263H760" stroke="#2b3c53"/><text x="60" y="307" fill="#7dbbff" font-size="14" letter-spacing="2">BEGONEERAJ / PROJECT COLLECTION</text></g></svg>
